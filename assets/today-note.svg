<svg xmlns="http://www.w3.org/2000/svg" width="880" height="256" viewBox="0 0 880 256" font-family="'Courier New', 'SF Mono', Consolas, monospace">
  <defs>
    <pattern id="sl-note" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <linearGradient id="hdr-note" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="880" height="256" rx="8" fill="#0d1117"/>
  <rect width="880" height="256" rx="8" fill="url(#sl-note)"/>
  <rect x="0.5" y="0.5" width="879" height="255" rx="8" fill="none" stroke="#21262d" stroke-width="1"/>

  <rect x="0" y="0" width="880" height="44" rx="8" fill="url(#hdr-note)"/>
  <rect x="0" y="38" width="880" height="6" fill="#0d1117"/>
  <line x1="0" y1="44" x2="880" y2="44" stroke="#e6edf3" stroke-width="0.6" opacity="0.35"/>
  <text x="20" y="28" fill="#e6edf3" font-size="13" letter-spacing="2">// TODAY'S NOTE</text>
  <text x="180" y="28" fill="#6e7681" font-size="10" letter-spacing="1">from your latest comment</text>
  <text x="860" y="28" fill="#e6edf3" font-size="11" text-anchor="end" letter-spacing="1" opacity="0.75">↻ 3mo ago</text>

  <text x="36" y="92" fill="#6e7681" font-size="32" font-weight="700" opacity="0.4">&#8220;</text>
  <text x="52" y="110" fill="#ffffff" font-size="18" font-style="italic">Human is the Bottleneck. The days after the 20 may i started managing people</text>
  <text x="52" y="138" fill="#e6edf3" font-size="16" font-style="italic">in my project, what i noticed is that my productivity was completely gone.</text>
  <text x="844" y="152" fill="#6e7681" font-size="32" font-weight="700" text-anchor="end" opacity="0.4">&#8221;</text>

  <line x1="36" y1="174" x2="844" y2="174" stroke="#21262d" stroke-width="0.5"/>

  <rect x="300" y="190" width="280" height="36" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.5"/>
  <text x="440" y="213" fill="#ffffff" font-size="11" text-anchor="middle" letter-spacing="2" font-weight="700">[ + ] EDIT OR ADD A NEW NOTE</text>
</svg>
