<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none">
  <rect width="1200" height="280" fill="#000000"/>

  <!-- corner brackets -->
  <g stroke="#ffffff" stroke-width="0.6" opacity="0.25" fill="none">
    <path d="M 24 24 L 24 60 M 24 24 L 60 24"/>
    <path d="M 1176 24 L 1176 60 M 1176 24 L 1140 24"/>
    <path d="M 24 256 L 24 220 M 24 256 L 60 256"/>
    <path d="M 1176 256 L 1176 220 M 1176 256 L 1140 256"/>
  </g>

  <!-- Main name -->
  <text x="600" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="6">
    ARMANDO BATTAGLINO
  </text>

  <!-- Drawing line under name -->
  <line x1="600" y1="170" x2="600" y2="170" stroke="#ffffff" stroke-width="0.8" opacity="0.5">
    <animate attributeName="x1" from="600" to="480" dur="1.6s" fill="freeze" begin="0.4s"/>
    <animate attributeName="x2" from="600" to="720" dur="1.6s" fill="freeze" begin="0.4s"/>
  </line>

  <!-- Italic subtitle -->
  <text x="600" y="210" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="18"
        fill="#ffffff" text-anchor="middle" opacity="0.7" letter-spacing="0.5">
    between signal and silence
  </text>

  <!-- Blinking cursor after subtitle -->
  <rect x="714" y="195" width="2" height="18" fill="#ffffff" opacity="0.7">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
