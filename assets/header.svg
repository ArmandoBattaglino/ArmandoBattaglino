<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <pattern id="scanlines" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff66" stroke-width="0.3" opacity="0.12"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" fill="#000000"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect width="1200" height="260" fill="url(#scanlines)"/>
  <rect width="1200" height="260" fill="url(#vignette)"/>

  <!-- Top border line -->
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#00ff66" stroke-width="0.6" opacity="0.55"/>

  <!-- Top status bar -->
  <text x="20" y="28" font-family="'Courier New', 'Consolas', monospace" font-size="11"
        fill="#00ff66" letter-spacing="1" filter="url(#glow)">
    [SYS] MISSION_CONTROL :: ARMANDO_BATTAGLINO :: NODE_001 :: ROME-IT :: BUILD 2026.05
  </text>
  <circle cx="1130" cy="24" r="3" fill="#00ff66" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="1180" y="28" font-family="'Courier New', monospace" font-size="11"
        fill="#00ff66" text-anchor="end" letter-spacing="1" filter="url(#glow)">
    ONLINE
  </text>

  <!-- Main name -->
  <text x="600" y="125" font-family="'Courier New', 'Consolas', monospace"
        font-size="46" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="9">
    ARMANDO BATTAGLINO
  </text>

  <!-- Subtitle -->
  <text x="600" y="162" font-family="'Courier New', monospace" font-size="13"
        fill="#00ff66" text-anchor="middle" letter-spacing="7" filter="url(#glow)">
    &gt;&gt; BUILDER · ITALY · UNFILTERED &lt;&lt;
  </text>

  <!-- Bottom border line -->
  <line x1="0" y1="206" x2="1200" y2="206" stroke="#00ff66" stroke-width="0.6" opacity="0.55"/>

  <!-- Bottom command line -->
  <text x="20" y="232" font-family="'Courier New', monospace" font-size="12"
        fill="#ffffff" opacity="0.85">
    armando@workshop:~$ ./make-something-strange.sh
  </text>
  <rect x="345" y="221" width="7" height="13" fill="#00ff66" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <text x="1180" y="232" font-family="'Courier New', monospace" font-size="11"
        fill="#ffffff" opacity="0.55" text-anchor="end">
    LOAD 0.42 0.38 0.31  ·  UPTIME 4y 2m  ·  TZ UTC+02
  </text>

  <!-- Corner brackets -->
  <g stroke="#00ff66" stroke-width="0.8" opacity="0.55" fill="none">
    <path d="M 8 8 L 8 24 M 8 8 L 24 8"/>
    <path d="M 1192 8 L 1192 24 M 1192 8 L 1176 8"/>
    <path d="M 8 252 L 8 236 M 8 252 L 24 252"/>
    <path d="M 1192 252 L 1192 236 M 1192 252 L 1176 252"/>
  </g>
</svg>
