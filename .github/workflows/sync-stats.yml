name: Sync Stats Panels

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/sync-stats.js
      - .github/workflows/sync-stats.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync stats panels
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node scripts/sync-stats.js

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/building-public.svg assets/building-private.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(stats): refresh public/private build cards"
            git push
          fi
