name: Sync Stats Panels

on:
  # Two parallel schedules with offset — GitHub deprioritizes high-frequency
  # cron jobs under load, so doubling up gives better odds at least one fires.
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Avoid concurrent runs racing each other
concurrency:
  group: sync-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync stats panels
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node scripts/sync-stats.js

      - name: Commit & push (retry on race)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/daily-grind.svg assets/building-public.svg assets/building-private.svg assets/telemetry-public.svg assets/telemetry-private.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(stats): refresh build cards"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, rebasing on latest main…"
            git pull --rebase --autostash origin main || true
            sleep 2
          done
          echo "Failed after 5 attempts"
          exit 1
